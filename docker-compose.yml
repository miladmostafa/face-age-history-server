services:
  history-server:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/history.db
      HOST: 0.0.0.0
      PORT: "3000"
      DEMO_ENABLED: "true"
    volumes:
      - history-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  history-data:
